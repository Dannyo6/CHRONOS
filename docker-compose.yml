version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  influxdb:
    image: influxdb:2.7
    ports:
      - "8181:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=chronosadmin
      - DOCKER_INFLUXDB_INIT_PASSWORD=supersecretpassword
      - DOCKER_INFLUXDB_INIT_ORG=vitality
      - DOCKER_INFLUXDB_INIT_BUCKET=chronos_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token

  grafana:
    image: grafana/grafana:latest
    container_name: chronos_grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
